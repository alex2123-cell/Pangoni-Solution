<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
    <title>Pangoni Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
    
</head>

<body class="bg-dark text-white text-center p-4">

    <h1 class="mb-4">Pangoni Solution Dashboard</h1>

  <div class="container mt-4">
    <div class="row g-3">

        <div class="col-md-3">
            <div class="card p-3 shadow">
                <h5>System Info</h5>
                <button class="btn btn-primary mt-2" onclick="getSystem()">Run</button>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow">
                <h5>Optimize</h5>
                <button class="btn btn-success mt-2" onclick="optimize()">Run</button>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow">
                <h5>Antivirus</h5>
                <button class="btn btn-warning mt-2" onclick="checkAntivirus()">Run</button>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card p-3 shadow">
                <h5>Network</h5>
                <button class="btn btn-info mt-2" onclick="checkNetwork()">Run</button>
            </div>
        </div>

    </div>
  </div>

    <h4 class="text-secondary">System Monitoring Dashboard</h4>

    <pre id="output" class="bg-black text-success p-3 mt-4 rounded"></pre>

    <canvas id="cpuChart" class="mt-4"></canvas>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
