<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pangoni Dashboard</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-primary text-light">
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Pangoni Solution</span>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="mb-3 text-center">System Monitoring Dashboard</h1>

    <div class="row g-3 justify-content-center">
      <div class="col-sm-6 col-md-3">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">System Info</h5>
          <button class="btn btn-primary mt-2 w-100" onclick="getSystem()">Refresh</button>
        </div>
      </div>

      <div class="col-sm-6 col-md-3">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Optimize</h5>
          <button class="btn btn-success mt-2 w-100" onclick="optimize()">Run</button>
        </div>
      </div>

      <div class="col-sm-6 col-md-3">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Antivirus</h5>
          <button class="btn btn-warning mt-2 w-100" onclick="checkAntivirus()">Run</button>
        </div>
      </div>

      <div class="col-sm-6 col-md-3">
        <div class="card p-3 shadow-sm">
          <h5 class="card-title">Network</h5>
          <button class="btn btn-info mt-2 w-100" onclick="checkNetwork()">Run</button>
        </div>
      </div>
    </div>

    <section class="mt-4">
      <pre id="output" class="bg-dark text-success p-3 rounded"></pre>
      <canvas id="cpuChart" class="mt-4" height="120"></canvas>
    </section>
  </main>

  <!-- Chart.js should load before our script -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Our script -->
  <script src="script.js"></script>
</body>
</html>
